<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar Carros — AutoMarket</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar scrolled" id="navbar">
  <div class="nav-inner">
    <a href="/" class="logo">Auto<span>Market</span></a>
    <ul class="nav-links">
      <li><a href="/">Início</a></li>
      <li><a href="busca" class="active">Buscar Carros</a></li>
      <li><a href="/#como-funciona">Como Funciona</a></li>
      <li><a href="#contato">Contato</a></li>
    </ul>
    <div class="nav-actions">
      <a href="/login" class="btn-ghost" id="nav-login-btn">Entrar</a>
      <a href="/cadastro-veiculo" class="btn-solid">Anunciar</a>
    </div>
    <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="busca-layout">

  <!-- FILTROS -->
  <aside class="filtros-panel" id="filtros-panel">
    <div class="filtros-header">
      <h3>Filtros</h3>
      <button class="filtros-limpar" onclick="limparFiltros()">Limpar tudo</button>
    </div>

    <div class="filtro-group">
      <label class="filtro-label">Marca</label>
      <select id="f-marca" onchange="aplicarFiltros()">
        <option value="">Todas as marcas</option>
        <option>Volkswagen</option>
        <option>Chevrolet</option>
        <option>Fiat</option>
        <option>Toyota</option>
        <option>Honda</option>
        <option>Hyundai</option>
        <option>Jeep</option>
        <option>Ford</option>
        <option>BMW</option>
        <option>Mercedes-Benz</option>
        <option>Renault</option>
        <option>Nissan</option>
      </select>
    </div>

    <div class="filtro-group">
      <label class="filtro-label">Modelo</label>
      <input type="text" id="f-modelo" placeholder="Ex: Polo, Onix..." oninput="aplicarFiltros()" class="form-input">
    </div>

    <div class="filtro-group">
      <label class="filtro-label">Ano</label>
      <div class="range-inputs">
        <select id="f-ano-min" onchange="aplicarFiltros()">
          <option value="">De</option>
          <option>2010</option><option>2012</option><option>2014</option>
          <option>2016</option><option>2018</option><option>2020</option>
          <option>2022</option><option>2024</option>
        </select>
        <select id="f-ano-max" onchange="aplicarFiltros()">
          <option value="">Até</option>
          <option>2012</option><option>2014</option><option>2016</option>
          <option>2018</option><option>2020</option><option>2022</option>
          <option>2024</option><option>2025</option>
        </select>
      </div>
    </div>

    <div class="filtro-group">
      <label class="filtro-label">Preço</label>
      <div class="range-inputs">
        <input type="number" id="f-preco-min" placeholder="Mínimo" oninput="aplicarFiltros()" class="form-input">
        <input type="number" id="f-preco-max" placeholder="Máximo" oninput="aplicarFiltros()" class="form-input">
      </div>
    </div>

    <div class="filtro-group">
      <label class="filtro-label">KM máximo</label>
      <select id="f-km" onchange="aplicarFiltros()">
        <option value="">Qualquer</option>
        <option value="10000">Até 10.000 km</option>
        <option value="30000">Até 30.000 km</option>
        <option value="60000">Até 60.000 km</option>
        <option value="100000">Até 100.000 km</option>
        <option value="150000">Até 150.000 km</option>
      </select>
    </div>

    <div class="filtro-group">
      <label class="filtro-label">Câmbio</label>
      <div class="check-options">
        <label class="check-opt"><input type="checkbox" value="manual" onchange="aplicarFiltros()"> Manual</label>
        <label class="check-opt"><input type="checkbox" value="automatico" onchange="aplicarFiltros()"> Automático</label>
        <label class="check-opt"><input type="checkbox" value="cvt" onchange="aplicarFiltros()"> CVT</label>
      </div>
    </div>

    <div class="filtro-group">
      <label class="filtro-label">Combustível</label>
      <div class="check-options">
        <label class="check-opt"><input type="checkbox" value="flex" onchange="aplicarFiltros()"> Flex</label>
        <label class="check-opt"><input type="checkbox" value="gasolina" onchange="aplicarFiltros()"> Gasolina</label>
        <label class="check-opt"><input type="checkbox" value="diesel" onchange="aplicarFiltros()"> Diesel</label>
        <label class="check-opt"><input type="checkbox" value="eletrico" onchange="aplicarFiltros()"> Elétrico</label>
      </div>
    </div>

    <div class="filtro-group">
      <label class="filtro-label">Cor</label>
      <div class="color-options" id="color-options">
        <!-- preenchido via JS -->
      </div>
    </div>

    <button class="btn-submit" onclick="aplicarFiltros()">Aplicar Filtros</button>
  </aside>

  <!-- RESULTADOS -->
  <main class="resultados-area">
    <div class="resultados-header">
      <div class="resultados-info">
        <h2 id="result-count">Carregando...</h2>
        <div class="busca-rapida">
          <input type="text" id="busca-texto" placeholder="🔍  Busca rápida..." oninput="aplicarFiltros()" class="form-input search-quick">
        </div>
      </div>
      <div class="resultados-controls">
        <div class="view-btns">
          <button class="view-btn active" id="vgrid" onclick="setView('grid')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </button>
          <button class="view-btn" id="vlist" onclick="setView('list')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="2" rx="1"/><rect x="3" y="11" width="18" height="2" rx="1"/><rect x="3" y="17" width="18" height="2" rx="1"/></svg>
          </button>
        </div>
        <select id="ordenar" onchange="aplicarFiltros()" class="form-input sort-select">
          <option value="recente">Mais recentes</option>
          <option value="menor-preco">Menor preço</option>
          <option value="maior-preco">Maior preço</option>
          <option value="menor-km">Menor KM</option>
          <option value="menor-ano">Mais antigos</option>
        </select>
        <button class="filtro-mob-btn" onclick="toggleFiltros()">⚙ Filtros</button>
      </div>
    </div>

    <div class="cars-grid" id="resultados-grid">
      <!-- preenchido via JS -->
    </div>

    <div class="empty-state hidden" id="empty-state">
      <div class="empty-icon">🔍</div>
      <h3>Nenhum veículo encontrado</h3>
      <p>Tente ajustar os filtros para encontrar mais opções.</p>
      <button onclick="limparFiltros()" class="btn-submit">Limpar Filtros</button>
    </div>

    <div class="pagination" id="pagination"></div>
  </main>
</div>

<!-- Modal de detalhes do carro -->
<div class="modal-overlay hidden" id="car-modal">
  <div class="modal-card" id="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <!-- Preenchido via JS -->
  </div>
</div>

<script src="js/app-store.js"></script>
<script src="js/data.js"></script>
<script src="js/busca.js"></script>
</body>
</html>
