quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
# quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/automarket
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.db-name=automarket

quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.database.default-schema=public
# Cria/atualiza tabelas automaticamente
quarkus.hibernate-orm.schema-management.strategy=update
# Usuários e veículos iniciais: ver DadosIniciais.java (roda só se a tabela usuario estiver vazia)

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

# Porta (mude se 8080 estiver ocupada)
quarkus.http.port=8080

quarkus.analytics.disabled=true
quarkus.http.auth.proactive=false
